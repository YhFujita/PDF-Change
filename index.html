<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Connector - プレミアムPDF結合ツール</title>
    <meta name="description" content="ブラウザ上で安全かつ簡単に複数のPDFファイルを結合できる無料Webツール。並べ替え機能付き。">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h1>PDF Connector</h1>
            </div>
            <nav class="app-nav">
                <!-- 将来的な機能拡張のためのナビゲーションプレースホルダー -->
                <button class="nav-btn active" title="PDF結合"><i class="fa-solid fa-link"></i> <span>結合</span></button>
                <button class="nav-btn disabled" title="近日公開: Word変換"><i class="fa-solid fa-file-word"></i>
                    <span>Word変換</span></button>
                <button class="nav-btn disabled" title="近日公開: 画像変換"><i class="fa-solid fa-image"></i>
                    <span>画像変換</span></button>
            </nav>
        </header>

        <main class="main-content">
            <div class="layout-wrapper">
                <div class="column-left">
                    <section class="upload-section">
                        <div class="glass-panel upload-area" id="drop-zone">
                            <div class="upload-content">
                                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                                <h2>PDFファイルをドラッグ＆ドロップ</h2>
                                <p>またはクリックして選択</p>
                                <!-- label was misleading if the whole zone is clickable, removing label wrapper behavior for simple text -->
                                <span class="custom-file-upload-look">
                                    ファイルを選択
                                </span>
                                <input type="file" id="file-input" accept=".pdf" multiple>
                                <p class="limit-info">複数のPDFファイルを選択できます</p>
                            </div>
                        </div>
                    </section>

                    <section class="action-section hidden" id="action-section">
                        <button id="merge-btn" class="primary-btn glow-effect">
                            <i class="fa-solid fa-file-pdf"></i> 結合してダウンロード
                        </button>
                    </section>
                </div>

                <div class="column-right hidden" id="file-list-column">
                    <section class="file-list-section" id="file-list-section">
                        <div class="glass-panel list-panel">
                            <div class="panel-header">
                                <h3>ファイルリスト <span id="file-count">0</span></h3>
                                <div class="header-actions">
                                    <p class="hint"><i class="fa-solid fa-arrows-up-down"></i> 並べ替え可能</p>
                                    <button id="clear-btn" class="text-btn danger">すべて削除</button>
                                </div>
                            </div>
                            <ul id="file-list" class="file-list">
                                <!-- ファイルアイテムがここに動的に追加されます -->
                            </ul>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2025 Antigravity PDF Tools. All rights reserved.</p>
        </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>PDFを処理中...</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
