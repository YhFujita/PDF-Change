<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Connector - プレミアムPDF結合ツール</title>
    <meta name="description" content="ブラウザ上で安全かつ簡単に複数のPDFファイルを結合できる無料Webツール。並べ替え機能付き。">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Docx and Tesseract -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h1>PDF Connector</h1>
            </div>
            <!-- Navigation removed as per user request -->
            <!-- <nav class="app-nav"> ... </nav> -->
        </header>

        <main class="main-content">
            <div class="layout-wrapper">
                <div class="column-left">
                    <section class="upload-section">
                        <div class="glass-panel upload-area" id="drop-zone">
                            <div class="upload-content">
                                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                                <h2>PDFファイルをドラッグ＆ドロップ</h2>
                                <p>またはクリックして選択</p>
                                <!-- label was misleading if the whole zone is clickable, removing label wrapper behavior for simple text -->
                                <span class="custom-file-upload-look">
                                    ファイルを選択
                                </span>
                                <input type="file" id="file-input" accept=".pdf, .jpg, .jpeg, .png" multiple>
                                <p class="limit-info">複数のPDFファイルを選択できます</p>
                            </div>
                        </div>
                    </section>

                    <section class="action-section hidden" id="action-section">
                        <div class="action-buttons-container">
                            <button id="merge-btn" class="action-btn-large primary-gradient glow-effect">
                                <span class="btn-icon"><i class="fa-solid fa-file-pdf"></i></span>
                                <span class="btn-text">
                                    <span class="btn-title">結合してダウンロード</span>
                                    <span class="btn-subtitle">PDFファイルとして保存</span>
                                </span>
                            </button>
                            <button id="convert-btn" class="action-btn-large secondary-gradient glow-effect">
                                <span class="btn-icon"><i class="fa-solid fa-images"></i></span>
                                <span class="btn-text">
                                    <span class="btn-title">画像に変換してプレビュー</span>
                                    <span class="btn-subtitle">高画質PNGとして生成</span>
                                </span>
                            </button>
                            <button id="word-btn" class="action-btn-large word-gradient glow-effect">
                                <span class="btn-icon"><i class="fa-solid fa-file-word"></i></span>
                                <span class="btn-text">
                                    <span class="btn-title">Wordに変換</span>
                                    <span class="btn-subtitle">テキスト抽出 & OCR</span>
                                </span>
                            </button>
                            <label class="checkbox-container text-white">
                                <input type="checkbox" id="vertical-text-opt">
                                <span class="checkmark"></span>
                                <span class="label-text">縦書きの画像を読み取る</span>
                            </label>
                        </div>
                        <div id="progress-container" class="hidden">
                            <p id="progress-text">処理中...</p>
                            <div class="progress-bar-bg">
                                <div id="progress-bar-fill" class="progress-bar-fill"></div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="column-right hidden" id="file-list-column">
                    <section class="file-list-section" id="file-list-section">
                        <div class="glass-panel list-panel">
                            <div class="panel-header">
                                <h3>ファイルリスト <span id="file-count">0</span></h3>
                                <div class="header-actions">
                                    <p class="hint"><i class="fa-solid fa-arrows-up-down"></i> 並べ替え可能</p>
                                    <button id="clear-btn" class="text-btn danger">すべて削除</button>
                                </div>
                            </div>
                            <ul id="file-list" class="file-list">
                                <!-- ファイルアイテムがここに動的に追加されます -->
                            </ul>
                        </div>
                    </section>
                </div>
            </div>

            <section id="preview-section" class="preview-section hidden">
                <div class="glass-panel preview-panel">
                    <div class="panel-header">
                        <h3><i class="fa-solid fa-images"></i> 変換結果プレビュー</h3>
                        <button id="download-zip-btn" class="secondary-btn small-btn">
                            <i class="fa-solid fa-file-zipper"></i> まとめてZIP保存
                        </button>
                    </div>
                    <div id="preview-grid" class="preview-grid">
                        <!-- Images will be injected here -->
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2025 Antigravity PDF Tools. All rights reserved.</p>
        </footer>
    </div>

    <!-- マスキング編集モーダル -->
    <div id="masking-modal" class="modal-overlay hidden">
        <div class="modal-container masking-modal-container">
            <div class="modal-header">
                <div class="modal-title-group">
                    <i class="fa-solid fa-user-shield modal-icon"></i>
                    <div>
                        <h3 id="mask-doc-title">個人情報マスキング編集</h3>
                        <p id="mask-doc-subtitle" class="modal-subtitle">ドラッグして墨消ししたい箇所を四角形で囲んでください</p>
                    </div>
                </div>
                <div class="modal-header-actions">
                    <!-- ページネーション（PDFなど複数ページ用） -->
                    <div id="mask-page-nav" class="page-navigation hidden">
                        <button id="mask-prev-page" class="nav-btn" title="前のページ"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="mask-page-indicator">1 / 1</span>
                        <button id="mask-next-page" class="nav-btn" title="次のページ"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <button id="mask-modal-close" class="modal-close-btn" title="閉じる"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="masking-toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">マスク色:</span>
                    <button id="color-black-btn" class="tool-btn active" data-color="#000000" title="黒塗り（墨消し）">
                        <span class="color-swatch black"></span> 黒塗り
                    </button>
                    <button id="color-white-btn" class="tool-btn" data-color="#ffffff" title="白塗り">
                        <span class="color-swatch white"></span> 白塗り
                    </button>
                </div>

                <div class="toolbar-separator"></div>

                <div class="toolbar-group">
                    <button id="mask-undo-btn" class="tool-btn" title="元に戻す (Ctrl+Z)">
                        <i class="fa-solid fa-rotate-left"></i> 元に戻す
                    </button>
                    <button id="mask-redo-btn" class="tool-btn" title="やり直し (Ctrl+Y)">
                        <i class="fa-solid fa-rotate-right"></i> やり直し
                    </button>
                    <button id="mask-clear-page-btn" class="tool-btn danger-hover" title="このページのマスクを全消去">
                        <i class="fa-solid fa-trash-can"></i> ページ内全消去
                    </button>
                </div>

                <div class="toolbar-separator"></div>

                <div class="toolbar-group">
                    <button id="mask-zoom-out" class="tool-btn icon-only" title="縮小"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <span id="mask-zoom-level" class="zoom-level-text">100%</span>
                    <button id="mask-zoom-in" class="tool-btn icon-only" title="拡大"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button id="mask-zoom-fit" class="tool-btn icon-only" title="画面に合わせる"><i class="fa-solid fa-expand"></i></button>
                </div>

                <div class="toolbar-info">
                    <span class="security-badge"><i class="fa-solid fa-shield-halved"></i> 完全不可逆化（安全保護）</span>
                </div>
            </div>

            <div class="masking-workspace" id="masking-workspace">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <!-- 下絵用Canvasとマスク描画インタラクティブCanvas -->
                    <canvas id="mask-bg-canvas"></canvas>
                    <canvas id="mask-interactive-canvas"></canvas>
                </div>
            </div>

            <div class="modal-footer masking-modal-footer">
                <div class="footer-left">
                    <span id="mask-count-info" class="mask-count-text">現在のマスク数: 0</span>
                </div>
                <div class="footer-actions">
                    <button id="mask-cancel-btn" class="secondary-btn">キャンセル</button>
                    <button id="mask-download-img-btn" class="secondary-btn">
                        <i class="fa-solid fa-image"></i> 画像で保存
                    </button>
                    <button id="mask-download-pdf-btn" class="secondary-btn">
                        <i class="fa-solid fa-file-pdf"></i> PDFで保存
                    </button>
                    <button id="mask-apply-btn" class="action-btn-primary">
                        <i class="fa-solid fa-check"></i> リストに反映して保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>PDFを処理中...</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
